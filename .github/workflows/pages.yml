name: Publish project page
on:
  push:
    branches: [main]
    paths:
      - docs/index.html
      - docs/embed/**
      - docs/site.css
      - docs/screenshot.png
      - docs/screenshot-light.png
      - docs/strata-editor.svg
      - .github/workflows/pages.yml
      - scripts/stamp-site.sh
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the static project page
        run: |
          mkdir -p _site
          cp docs/index.html docs/site.css docs/screenshot.png docs/screenshot-light.png docs/strata-editor.svg _site/
          cp -r docs/embed _site/embed
      - name: Stamp version and release date
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/stamp-site.sh _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
