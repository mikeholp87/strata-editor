name: Publish project page
on:
  push:
    branches: [main]
    paths:
      - docs/index.html
      - docs/site.css
      - docs/screenshot.png
      - docs/screenshot-light.png
      - docs/strata-editor.svg
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the static project page
        run: |
          mkdir -p _site
          cp docs/index.html docs/site.css docs/screenshot.png docs/screenshot-light.png docs/strata-editor.svg _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
