name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build qt6-base-dev
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: cpack --config build/CPackConfig.cmake
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            *.deb
            *.tar.gz
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Show the behavior test output when it fails
        if: failure()
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          foreach ($name in 'strata-hardening-tests','strata-tests') {
            $exe = (Resolve-Path "build/Release/$name.exe").Path
            $p = Start-Process -FilePath $exe -ArgumentList '-v2','-o',"$name.txt,txt" -NoNewWindow -PassThru
            if (-not $p.WaitForExit(120000)) { $p.Kill(); "TIMED OUT after 120 s" }
            "== $name exit code: $($p.ExitCode)"
            Select-String -Path "$name.txt" -Pattern 'FAIL!|DBG' -Context 0,4 | ForEach-Object { $_.ToString() }
          }
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item build/Release/strata-editor.exe dist/
          windeployqt --release --no-translations dist/strata-editor.exe
          Copy-Item LICENSE,THIRD_PARTY.md dist/
          $qtLicenses = Join-Path (Split-Path $env:QT_ROOT_DIR -Parent) 'Licenses'
          New-Item -ItemType Directory -Force dist/Qt-Licenses | Out-Null
          if (Test-Path $qtLicenses) {
            Copy-Item -Recurse "$qtLicenses/*" dist/Qt-Licenses
          } else {
            # aqtinstall ships no Licenses folder; take the texts from the sources of the exact Qt version linked
            foreach ($name in 'LGPL-3.0-only','GPL-3.0-only') {
              Invoke-WebRequest "https://code.qt.io/cgit/qt/qtbase.git/plain/LICENSES/$name.txt?h=v6.8.3" -OutFile "dist/Qt-Licenses/$name.txt"
              if ((Get-Item "dist/Qt-Licenses/$name.txt").Length -lt 1000) { throw "Qt license text $name was not downloaded" }
            }
            "Strata Editor links Qt 6.8.3 dynamically under the LGPL-3.0. Qt sources: https://download.qt.io/official_releases/qt/6.8/6.8.3/" | Set-Content dist/Qt-Licenses/NOTICE.txt
          }
          Compress-Archive dist/* strata-editor-windows-preview.zip
          Expand-Archive strata-editor-windows-preview.zip verified-dist
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:XDG_DATA_HOME = Join-Path $env:RUNNER_TEMP 'strata-smoke-data'
          $env:XDG_CONFIG_HOME = Join-Path $env:RUNNER_TEMP 'strata-smoke-config'
          $smoke = Start-Process -FilePath (Join-Path $PWD 'verified-dist/strata-editor.exe') -ArgumentList '--smoke-test' -PassThru
          if (-not $smoke.WaitForExit(15000)) { $smoke.Kill(); throw 'Packaged application smoke test timed out' }
          if ($smoke.ExitCode -ne 0) { throw "Packaged application smoke test failed: $($smoke.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview
          path: strata-editor-windows-preview.zip
