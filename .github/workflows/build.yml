name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build qt6-base-dev
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: cpack --config build/CPackConfig.cmake
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            *.deb
            *.tar.gz
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item build/Release/strata-editor.exe dist/
          windeployqt --release --no-translations dist/strata-editor.exe
          Copy-Item LICENSE,THIRD_PARTY.md dist/
          if (Test-Path "$env:QT_ROOT_DIR/../Licenses") { Copy-Item -Recurse "$env:QT_ROOT_DIR/../Licenses" dist/Qt-Licenses }
          Compress-Archive dist/* strata-editor-windows-preview.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview
          path: strata-editor-windows-preview.zip
